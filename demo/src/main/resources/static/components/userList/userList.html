<div class="container" ng-controller="UserListController as vm">
    <h2>Daftar Pengguna</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nama</th>
                <th>Email</th>
                <th>NIK</th>
                <th>Tanggal Lahir</th>
            </tr>
        </thead>
        <tbody>
            <tr ng-repeat="user in vm.users">
                <td>{{ user.id }}</td>
                <td>{{ user.name }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.nik }}</td>
                <td>{{ user.dob }}</td>
            </tr>
        </tbody>
    </table>
</div>
